name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: CLI smoke test
        run: |
          fwtool --version
          fwtool catalog import tests/fixtures/dell_catalog.xml --cache-dir smoke-cache
      - name: PowerShell script syntax (Windows PowerShell 5.1 and 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $check = '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/pilot-setup.ps1), [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 } else { "parse OK: $($PSVersionTable.PSVersion)" }'
          pwsh -NoProfile -Command $check
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -Command $check
          if ($LASTEXITCODE) { exit 1 }
