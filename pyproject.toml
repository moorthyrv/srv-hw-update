[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fwtool"
version = "0.1.0"
description = "Read-only firmware inventory and age/compliance reporting for Dell iDRAC and HPE iLO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fwtool = "fwtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
